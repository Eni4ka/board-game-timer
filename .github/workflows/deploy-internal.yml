name: Deploy to Play internal testing
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'store/**', '**.md', '.github/workflows/pages.yml', '.github/workflows/android.yml', '.github/workflows/release.yml']
  workflow_dispatch:
concurrency:
  group: deploy-internal
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check Play secret
        id: gate
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::PLAY_SERVICE_ACCOUNT_JSON не задан, выкладка пропущена"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ok == 'true'
        with: { distribution: temurin, java-version: 21 }
      - if: steps.gate.outputs.ok == 'true'
        run: npm ci && npm test
      - name: Restore keystore
        if: steps.gate.outputs.ok == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed AAB
        if: steps.gate.outputs.ok == 'true'
        env:
          VITE_ADMOB_BANNER_ID: ca-app-pub-6923300523417935/3412305311
          VITE_BUILD_ENV: internal
          VERSION_NAME: '1.0'
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          npm run cap:sync
          cd android && ./gradlew bundleRelease
      - name: Upload to internal testing
        if: steps.gate.outputs.ok == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.eni4ka.boardgametimer
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
